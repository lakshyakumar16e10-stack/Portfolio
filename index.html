<body>

  <!-- Background Fluid Environment -->
  <div class="fluid-stage">

    <div class="orb orb-purple"></div>
    <div class="orb orb-blend"></div>
    
    <!-- Dark Frosted Glass Overlay -->
    <div class="glass-canvas"></div>
  </div>

  <!-- Main Hero / Content Area (Preview Placeholder) -->

      <span class="badge">Portfolio Concept</span>

    </div>

  <!-- Bottom Navigation Section -->
  <footer class="bottom-dock">
    <!-- Distinct White Divider Line -->
    <div class="divider-line"></div>

    <!-- Controls Sitting Below the Line -->
    <nav class="nav-shelf">

        <button class="nav-btn" disabled>01 // Home</button>
        <button class="nav-btn" disabled>02 // About</button>
